# This workflow performs a build of the project and uploads the result as a build artifact.

name: Reusable MSBuild Workflow

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      build_artifact:
        required: true
        type: string
      configurations:
        required: false
        type: string
        default: '["Debug", "Release"]'

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 90

    strategy:
      matrix:
        configurations: ${{ fromJSON(inputs.configurations) }}
    runs-on: windows-2025
    env:
      SOLUTION_FILE_PATH: ebpf_extension_common.sln
      BUILD_ARTIFACT_NAME: ${{ inputs.build_artifact }}
      BUILD_CONFIGURATION: ${{ matrix.configurations }}
      BUILD_PLATFORM: x64

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit

    - id: skip_check
      uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5.3.2
      with:
        cancel_others: 'false'
        paths_ignore: '["**.md", "**/docs/**"]'

    - name: Set MSVC Environment Variables
      if: steps.skip_check.outputs.should_skip != 'true'
      shell: cmd
      run: |
        set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
        rem Write vswhere's output to a file rather than using a for/f loop: the ')' in the
        rem version range would otherwise be parsed as the closing paren of the for/f 'in (...)'
        rem clause, which breaks the quoting around the vswhere path.
        "%VSWHERE%" -latest -version "[18.0,19.0)" -property installationPath > "%TEMP%\vsinstallpath.txt"
        set /p VSINSTALLPATH=<"%TEMP%\vsinstallpath.txt"
        if not defined VSINSTALLPATH (
          echo Could not locate a Visual Studio 2026 installation via vswhere.
          exit /b 1
        )
        echo Visual Studio install path: %VSINSTALLPATH%
        call "%VSINSTALLPATH%\VC\Auxiliary\Build\vcvars64.bat"
        powershell.exe "echo 'msvc_tools_path=%VCToolsInstallDir%' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append"
        powershell.exe "echo 'msvc_tools_version=%VCToolsVersion%' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append"

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: steps.skip_check.outputs.should_skip != 'true'
      with:
        repository: ${{ github.repository }}
        submodules: 'recursive'
        ref: ${{ inputs.ref }}

    - name: Configure Windows Error Reporting to make a local copy of any crashes that occur.
      id: configure_windows_error_reporting
      if: steps.skip_check.outputs.should_skip != 'true'
      run: |
        mkdir c:/dumps/${{ env.BUILD_PLATFORM }}/${{ env.BUILD_CONFIGURATION }}
        New-Item -Path "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" -ErrorAction SilentlyContinue
        New-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" -Name "DumpType" -Value 2 -PropertyType DWord -ErrorAction SilentlyContinue
        New-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" -Name "DumpFolder" -Value "c:\dumps\${{ env.BUILD_PLATFORM }}\${{ env.BUILD_CONFIGURATION }}" -PropertyType ExpandString -ErrorAction SilentlyContinue

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0
      with:
        msbuild-architecture: x64
        # Pin to Visual Studio 2026 (toolset v145, WDK 10.0.28000) rather than taking whatever
        # the image happens to ship, so wdk.props selects a matching toolset and WDK version.
        vs-version: '[18.0,19.0)'

    - name: Generate Catch2 build files
      if: steps.skip_check.outputs.should_skip != 'true'
      # Build Catch2 with the static CRT (/MT, /MTd) to match the rest of the repo
      # (see RuntimeLibrary in Directory.Build.props); otherwise linking the test
      # executable fails with LNK2038 RuntimeLibrary mismatch.
      run: |
        cmake -G "Visual Studio 18 2026" -S external\Catch2 -B external\Catch2\build -DBUILD_TESTING=OFF "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded$<$<CONFIG:Debug>:Debug>"

    - name: Cache nuget packages
      if: steps.skip_check.outputs.should_skip != 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      env:
        cache-name: cache-nuget-modules
      with:
        path: packages
        key: ${{ runner.os }}-${{ env.BUILD_PLATFORM }}-${{ env.BUILD_CONFIGURATION }}-${{ env.BUILD_ARTIFACT_NAME }}-${{ hashFiles('**/packages.config') }}-${{ env.msvc_tools_version }}

    - name: NuGet Restore
      if: steps.skip_check.outputs.should_skip != 'true'
      run: |
        nuget restore packages.config -PackagesDirectory packages

    - name: Build
      if: steps.skip_check.outputs.should_skip != 'true'
      # Run the Restore target as well as Build. The packages.config restore above only covers
      # this repo's own packages; the usersim projects built by this solution use
      # PackageReference, and their Windows SDK / WDK packages are restored by MSBuild's Restore
      # target. Without it the build fails with MSB8036 ("The Windows SDK version 10.0.28000.0
      # was not found"), because the VS 2026 SDK is not installed on the runner image and has to
      # come from NuGet. This mirrors what usersim's own CI does.
      run: |
        msbuild /m /t:Restore,Build /p:Configuration=${{ env.BUILD_CONFIGURATION }} /p:Platform=${{ env.BUILD_PLATFORM }} ${{ env.SOLUTION_FILE_PATH }}

    - name: Zip Build Output
      if: always() && (steps.skip_check.outputs.should_skip != 'true')
      run: |
        Compress-Archive -Path ${{ env.BUILD_PLATFORM }}\${{ env.BUILD_CONFIGURATION }} -DestinationPath .\build-${{ matrix.configurations }}.zip

    - name: Upload Build Output
      if: always() && (steps.skip_check.outputs.should_skip != 'true')
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.build_artifact }}-${{ matrix.configurations }}
        path: ${{ github.workspace }}/build-${{ matrix.configurations }}.zip
        retention-days: 5

    - name: Check for crash dumps
      if: (success() || failure()) && (steps.skip_check.outputs.should_skip != 'true')
      uses: andstor/file-existence-action@558493d6c74bf472d87c84eab196434afc2fa029 # v3.1.0
      id: check_dumps
      with:
        files: c:/dumps/${{ env.BUILD_PLATFORM }}/${{ env.BUILD_CONFIGURATION }}/*.dmp

    - name: Upload any crash dumps
      if: (success() || failure()) && (steps.skip_check.outputs.should_skip != 'true') && (steps.check_dumps.outputs.files_exists == 'true')
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: Crash-Dumps-Build-${{ env.BUILD_PLATFORM }}-${{ env.BUILD_CONFIGURATION }}
        path: c:/dumps/${{ env.BUILD_PLATFORM }}/${{ env.BUILD_CONFIGURATION }}
        retention-days: 5
